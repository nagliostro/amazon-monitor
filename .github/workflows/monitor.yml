name: Monitor Amazon

on:
  schedule:
    - cron: "*/5 * * * *"   # o GitHub garante no máximo a cada 5 min (pode atrasar)
  workflow_dispatch:
    inputs:
      acao:
        description: "monitorar | rodada | teste"
        default: monitorar
      produto_id:
        description: "produto do alerta de teste (vazio = mensagem geral)"
        default: ""

permissions:
  contents: write

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # o teste não espera a fila do monitoramento
    concurrency:
      group: ${{ inputs.acao == 'teste' && 'teste' || 'monitor' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Enviar mensagem de teste
        if: inputs.acao == 'teste'
        env:
          PRODUTO_ID: ${{ inputs.produto_id }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py --teste-telegram

      - name: Checar disponibilidade
        if: inputs.acao != 'teste'
        env:
          DURACAO_MIN: ${{ inputs.acao == 'rodada' && '0' || '4' }}
          INTERVALO_S: "60"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Salvar estado (evita alerta repetido)
        if: inputs.acao != 'teste'
        run: |
          if [ -n "$(git status --porcelain estado.json)" ]; then
            git config user.name "monitor-bot"
            git config user.email "monitor-bot@users.noreply.github.com"
            git add estado.json
            git commit -m "estado atualizado"
            git pull --rebase
            git push
          fi
