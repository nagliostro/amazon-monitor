name: Monitor Amazon

on:
  schedule:
    - cron: "*/5 * * * *"   # o GitHub garante no máximo a cada 5 min (pode atrasar)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Checar disponibilidade
        env:
          ASIN: ${{ vars.ASIN || 'B0HK2KVYD7' }}
          PRECO_MAXIMO: ${{ vars.PRECO_MAXIMO }}
          SO_AMAZON: ${{ vars.SO_AMAZON || '1' }}
          DURACAO_MIN: "4"
          INTERVALO_S: "60"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Salvar estado (evita alerta repetido)
        run: |
          if [ -n "$(git status --porcelain estado.json)" ]; then
            git config user.name "monitor-bot"
            git config user.email "monitor-bot@users.noreply.github.com"
            git add estado.json
            git commit -m "estado: $(cat estado.json | tr -d '\n ')"
            git push
          fi
